<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omniball · Connected workspace</title>
<style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#f5f7f3;color:#203e2f;font:16px/1.6 system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}h1{font:400 38px Georgia,serif;margin:0}small,p{color:#52645e}main{max-width:1200px;margin:auto}canvas{display:block;background:white;max-width:100%;max-height:70vh;margin:24px auto;border:1px solid #dce5df;border-radius:12px}section{padding:24px;background:white;border:1px solid #dce5df;border-radius:20px;margin:24px 0}pre{white-space:pre-wrap;font:inherit}button{background:#116b58;color:white;border:0;border-radius:12px;min-height:48px;padding:12px 20px;font:inherit;cursor:pointer}:focus-visible{outline:3px solid #116b58;outline-offset:4px}</style>
<main><header><div><small>YOUR CONNECTED WORKSPACE</small><h1>Ideas, without borders.</h1></div><button id="download">Save board backup</button></header><p id="status" role="status">Waiting for your phone…</p><canvas id="board" width="900" height="600" aria-label="Incoming live drawing. Written notes appear below."></canvas><section><h2>Send to your phone</h2><label for="send-file">Choose a PDF, image, note, or board backup (up to 25 MB)</label><p><input id="send-file" type="file"></p><button id="send" disabled>Send file to phone</button><p id="send-status" role="status"></p></section><section><h2>Connected notes</h2><div id="notes">Notes will appear when a board arrives.</div></section><section><h2>Received files</h2><p>Files are saved in the companion’s received folder. They are never opened automatically.</p><ul id="files"></ul></section></main><script src="viewer.js"></script></html>
