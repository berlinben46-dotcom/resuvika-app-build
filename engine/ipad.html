<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Resuvika Omniball — iPad companion</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vikashya Pen">

  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .ipad-status-bar {
      position: fixed;
      top: 8px;
      left: 12px;
      z-index: 150;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .ipad-live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .ipad-live-dot.disconnected {
      background: #f43f5e;
      box-shadow: 0 0 10px #f43f5e;
    }
    .ipad-room-pill {
      background: rgba(59, 130, 246, 0.25);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
      padding: 2px 8px;
      border-radius: 10px;
      font-family: var(--font-mono);
      cursor: pointer;
    }
    .ipad-fullscreen-btn {
      position: fixed;
      top: 8px;
      right: 12px;
      z-index: 150;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body class="theme-dark tablet-app">

  <!-- iPad Top Status Bar with Room Code Trigger -->
  <div class="ipad-status-bar">
    <span class="ipad-live-dot" id="ipad-status-dot"></span>
    <span id="ipad-status-text">Connecting to computer…</span>
    <span class="ipad-room-pill" id="ipad-room-display">Local pairing</span>
  </div>

  <button class="ipad-fullscreen-btn" id="ipad-fs-btn" title="Toggle Fullscreen">⛶ Fullscreen</button>

  <!-- Clean Top-Right Quick Bar (Voice + Notes + Connect) -->
  <div id="mobile-top-actions" class="mobile-top-actions">
    <button type="button" id="mob-btn-voice" class="mob-top-pill" title="Voice Dictation &amp; Audio">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
      <span>Voice</span>
    </button>
    <button type="button" id="mob-btn-notes" class="mob-top-pill" title="Class Notes">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/></svg>
      <span>Notes</span>
    </button>
    <button type="button" id="mob-btn-connect" class="mob-top-pill" title="Connect Laptop or Smart TV">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></svg>
      <span>Connect</span>
    </button>
  </div>

  <!-- Quick Ink Color, Paper & Photo Strip -->
  <div id="mob-color-strip" class="mob-color-strip" aria-label="Quick ink colors, paper and photo">
    <button type="button" class="mob-ink-dot active" data-color="#ef4444" style="background:#ef4444" title="Red Ink"></button>
    <button type="button" class="mob-ink-dot" data-color="#2563eb" style="background:#2563eb" title="Blue Ink"></button>
    <button type="button" class="mob-ink-dot" data-color="#0f172a" style="background:#0f172a" title="Black Ink"></button>
    <button type="button" class="mob-ink-dot" data-color="#059669" style="background:#059669" title="Green Ink"></button>
    <button type="button" class="mob-ink-dot" data-color="#f59e0b" style="background:#f59e0b" title="Gold Ink"></button>
    <span class="mob-strip-div"></span>
    <button type="button" class="mob-paper-btn" id="mob-paper-toggle" title="Switch Paper (White / Grid / Dark)">Grid</button>
    <button type="button" class="mob-paper-btn" id="mob-photo-btn" title="Insert Photo or Diagram to Annotate">Photo</button>
    <input type="file" id="mob-photo-input" accept="image/*" style="display:none">
  </div>

  <!-- Pro Floating Bottom Dock (Pen, Scroll, Erase, Undo, Multi-Page) -->
  <nav id="mobile-bottom-bar" class="mobile-bottom-bar" aria-label="Quick drawing and page controls">
    <button type="button" class="mob-bar-btn active" id="mob-tool-pen" title="Draw / Write">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
      <span>Pen</span>
    </button>
    <button type="button" class="mob-bar-btn" id="mob-tool-pan" title="Scroll Canvas">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
      <span>Scroll</span>
    </button>
    <button type="button" class="mob-bar-btn" id="mob-tool-eraser" title="Eraser">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
      <span>Erase</span>
    </button>
    <button type="button" class="mob-bar-btn" id="mob-tool-undo" title="Undo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      <span>Undo</span>
    </button>
    <div class="mob-page-pill">
      <button type="button" id="btn-prev-page" class="mob-pg-arrow" title="Previous Page">‹</button>
      <span id="page-indicator-text" class="mob-pg-num">1 / 1</span>
      <button type="button" id="btn-next-page" class="mob-pg-arrow" title="Next Page">›</button>
      <button type="button" id="btn-add-page" class="mob-pg-add" title="New Blank Page">+</button>
    </div>
  </nav>

  <!-- Main Canvas Container -->
  <div id="canvas-container">
    <video id="screen-video" autoplay playsinline muted style="display: none;"></video>
    <canvas id="bg-canvas"></canvas>
    <canvas id="draw-canvas"></canvas>
    <canvas id="laser-canvas"></canvas>
  </div>

  <div class="tablet-input-mode"><button id="touch-draw-mode" class="active" title="Draw with a finger or Pencil">Touch + Pencil</button><button id="pencil-only-mode" title="Ignore fingers on the drawing area">Pencil only</button><button id="tablet-toolbar-toggle" aria-expanded="true">Hide tools</button></div>
  <!-- iPad Touch Toolbar -->
  <header id="main-toolbar" class="glass-toolbar" style="top: auto; bottom: 16px;">
    <!-- Brand -->
    <div class="toolbar-section brand-section">
      <div class="brand-logo">
        <img src="assets/vikashya.png" alt="Vikashya Resuvika" width="52">
        <span class="brand-text">Resuvika Omniball</span>
      </div>
      
      <!-- Board mode -->
      <div class="mode-selector">
        <button class="mode-btn active" data-bg="whiteboard">⚪ White</button>
        <button class="mode-btn" data-bg="blackboard">⚫ Dark</button>
        <button class="mode-btn" data-bg="chalkboard">🟢 Chalk</button>
        <button class="mode-btn" data-bg="grid">📐 Grid</button>
      </div>
    </div>

    <div class="toolbar-divider"></div>

    <!-- Drawing Tools -->
    <div class="toolbar-section tools-section">
      <button class="tool-btn active" data-tool="pen" title="Apple Pencil (P)">
        <span class="btn-icon">✏️</span>
        <span class="btn-label">Pen</span>
      </button>

      <button class="tool-btn" data-tool="highlighter" title="Highlighter (H)">
        <span class="btn-icon">🖍️</span>
        <span class="btn-label">Highlight</span>
      </button>

      <button class="tool-btn" data-tool="laser" title="Laser Pointer (L)">
        <span class="btn-icon">⚡</span>
        <span class="btn-label">Laser</span>
      </button>

      <!-- Shapes Dropdown -->
      <div class="dropdown-wrapper">
        <button class="tool-btn" id="shapes-dropdown-btn" title="Shapes (S)">
          <span class="btn-icon" id="active-shape-icon">📐</span>
          <span class="btn-label" id="active-shape-name">Shapes ▾</span>
        </button>

        <button id="shape-picker-toggle" class="shape-picker-toggle" type="button" title="Choose a different shape" aria-label="Choose shape" aria-expanded="false">▾</button>
        <div class="shapes-popover glass-panel" id="shapes-menu" style="bottom: calc(100% + 12px); top: auto;">
          <div class="shapes-grid">
            <button class="shape-opt active" data-shape="rect"><span class="opt-icon">▭</span> Rect</button>
            <button class="shape-opt" data-shape="rounded-rect"><span class="opt-icon">▢</span> Round</button>
            <button class="shape-opt" data-shape="circle"><span class="opt-icon">◯</span> Circle</button>
            <button class="shape-opt" data-shape="line"><span class="opt-icon">╱</span> Line</button>
            <button class="shape-opt" data-shape="arrow"><span class="opt-icon">➔</span> Arrow</button>
            <button class="shape-opt" data-shape="double-arrow"><span class="opt-icon">⬄</span> Dual</button>
            <button class="shape-opt" data-shape="triangle"><span class="opt-icon">△</span> Tri</button>
            <button class="shape-opt" data-shape="axes"><span class="opt-icon">✛</span> XY-Axis</button>
            <button class="shape-opt" data-shape="step-badge"><span class="opt-icon">①</span> Step 1-2-3</button>
          </div>
        </div>
      </div>

      <!-- 🪣 PAINT BUCKET FILL TOOL -->
      <button class="tool-btn" data-tool="bucket" title="Paint Bucket: Click any shape to fill it!">
        <span class="btn-icon">🪣</span>
        <span class="btn-label">Fill</span>
      </button>

      <!-- DIRECT SHAPE FILL BAR -->
      <div class="fill-selector-wrap" title="Shape Fill Mode">
        <span class="fill-label">Fill:</span>
        <button class="fill-btn active" data-fill="none" title="No Fill (Outline only)">🚫 Off</button>
        <button class="fill-btn" data-fill="tint" title="25% Soft Tint Fill">🎨 Tint</button>
        <button class="fill-btn" data-fill="solid" title="100% Solid Color Fill">⬛ Solid</button>
      </div>

      <!-- ✍️ ON-SCREEN TEXT TOOL -->
      <button class="tool-btn" data-tool="text" title="Screen Text: Tap anywhere to type directly on screen!">
        <span class="btn-icon">✍️</span>
        <span class="btn-label">Text</span>
      </button>

      <!-- Eraser -->
      <button class="tool-btn" data-tool="eraser-stroke" title="Eraser (E)">
        <span class="btn-icon">🧹</span>
        <span class="btn-label">Eraser</span>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <!-- Color Palette -->
    <div class="toolbar-section style-section">
      <div class="color-palette" id="color-palette">
        <button class="color-swatch active" style="--c: #ef4444;" data-color="#ef4444"></button>
        <button class="color-swatch" style="--c: #3b82f6;" data-color="#3b82f6"></button>
        <button class="color-swatch" style="--c: #10b981;" data-color="#10b981"></button>
        <button class="color-swatch" style="--c: #f59e0b;" data-color="#f59e0b"></button>
        <button class="color-swatch" style="--c: #8b5cf6;" data-color="#8b5cf6"></button>
        <button class="color-swatch" style="--c: #ffffff;" data-color="#ffffff"></button>
        <button class="color-swatch" style="--c: #0f172a;" data-color="#0f172a"></button>
        
        <label class="custom-color-label" title="Custom Color">
          <input type="color" id="custom-color-input" value="#ef4444">
          <span class="color-picker-icon">🎨</span>
        </label>
      </div>

      <div class="stroke-slider-wrap">
        <span class="size-preview-dot" id="size-preview"></span>
        <input type="range" id="stroke-size-slider" min="1" max="50" value="4">
        <span class="size-number" id="size-val">4px</span>
      </div>
    </div>

    <div class="toolbar-divider"></div>

    <!-- Actions -->
    <div class="toolbar-section action-section">
      <button class="icon-btn" id="btn-undo" title="Undo">↩️</button>
      <button class="icon-btn" id="btn-redo" title="Redo">↪️</button>
      <button class="pill-btn clear-drawings-btn" id="btn-clear" title="Clear drawings on every connected device; Undo restores them">Clear screen</button>
      
      <button class="pill-btn highlight-btn" id="btn-toggle-notepad" title="Class Notepad & Evernote Suite">
        <span class="btn-icon">📝</span>
        <span>Notes</span>
      </button>

      <button class="pill-btn rec-pen-btn" id="btn-recording-mode" title="Screen Pen / Video Recording Mode: Compact tools for recording and live presentations">
        <span class="btn-icon">🎥</span>
        <span>Screen Pen</span>
      </button>
    </div>
  </header>

  <!-- Full-Screen Clean Resuvika Classpad -->
  <aside id="floating-notepad" class="glass-panel notepad-panel hidden">
    <div class="notepad-header" id="notepad-drag-handle">
      <div class="notepad-title-group">
        <button class="np-action-btn" id="np-toggle-org" title="Folders &amp; Reminders">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
        </button>
        <span class="notepad-title">Classpad</span>
      </div>

      <div class="np-input-mode-switch" title="Switch between Typing and Pen">
        <button type="button" class="np-mode-pill active" id="np-mode-keypad">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/></svg>
          <span>Type</span>
        </button>
        <button type="button" class="np-mode-pill" id="np-mode-pen">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
          <span>Draw</span>
        </button>
      </div>

      <div class="notepad-header-actions">
        <button class="np-action-btn" id="np-pin-btn" title="Pin" style="display:none;">📌</button>
        <button class="np-action-btn" id="np-max-btn" title="Size" style="display:none;">⛶</button>
        <button class="np-action-btn" id="np-minimize-btn" title="Min" style="display:none;">−</button>
        <button class="np-action-btn" id="np-close-btn" title="Close Notes">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>

    <div class="np-onenote-shell">
      <!-- Slide-over Organizer (Classpads, Chapters & Reminders) -->
      <div class="np-organizer collapsed" id="np-organizer">
        <div class="np-org-tabs">
          <button type="button" class="np-org-tab active" id="np-org-tab-notes">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
            <span>Folders</span>
          </button>
          <button type="button" class="np-org-tab" id="np-org-tab-todo">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span>To-Do</span>
          </button>
          <button type="button" class="np-org-tab" id="np-org-tab-reminders">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span>Remind</span>
          </button>
        </div>

        <div class="np-org-pane" id="np-org-notes-pane">
          <div class="notepad-search-row">
            <input type="text" id="np-search-input" class="np-search-bar" placeholder="🔍 Search notes...">
          </div>
          <div class="np-org-actions">
            <button type="button" class="np-org-add-btn" id="np-add-classpad">+ Folder</button>
            <button type="button" class="np-org-add-btn" id="np-add-tab">+ Page</button>
          </div>
          <div class="np-classpad-list" id="np-tabs-bar"></div>
        </div>

        <div class="np-org-pane hidden" id="np-org-reminders-pane">
          <div class="np-rem-form">
            <input type="text" id="np-rem-title" class="np-search-bar" placeholder="Reminder title...">
            <input type="datetime-local" id="np-rem-time" class="np-search-bar">
            <button type="button" id="np-rem-add-btn" class="np-org-add-btn" style="width:100%;">⏰ Add Reminder</button>
          </div>
          <div class="np-rem-list" id="np-rem-list"></div>
        </div>

        <div class="np-org-pane hidden" id="np-org-todo-pane">
          <div class="np-rem-form">
            <input type="text" id="np-todo-input" class="np-search-bar" placeholder="Add a to-do task...">
            <button type="button" id="np-todo-add-btn" class="np-org-add-btn" style="width:100%;">+ Add To-Do</button>
          </div>
          <div class="np-rem-list" id="np-todo-list"></div>
        </div>

        <div class="np-sidebar-themes" id="np-sidebar-themes" title="Customize Sidebar Color">
          <span class="np-theme-lbl">Theme</span>
          <button type="button" class="np-theme-dot active" data-bg="#f8fafc" style="background:#f8fafc" title="Clean White"></button>
          <button type="button" class="np-theme-dot" data-bg="#e7f8ed" style="background:#e7f8ed" title="WhatsApp Mint"></button>
          <button type="button" class="np-theme-dot" data-bg="#e0f2fe" style="background:#e0f2fe" title="Sky Blue"></button>
          <button type="button" class="np-theme-dot" data-bg="#fef9c3" style="background:#fef9c3" title="Warm Cream"></button>
          <button type="button" class="np-theme-dot" data-bg="#f3e8ff" style="background:#f3e8ff" title="Lavender"></button>
          <button type="button" class="np-theme-dot" data-bg="#0f172a" style="background:#0f172a" title="Midnight"></button>
        </div>
      </div>

      <!-- Full-Screen Paper Workspace -->
      <div class="np-workspace">
        <div class="notepad-format-bar">
          <div class="fmt-group">
            <button type="button" class="np-mini-btn" id="np-dictate-btn" title="Speak to Write (Any Language)">🗣️ Dictate</button>
            <button class="np-fmt-btn" data-fmt="bold" title="Bold"><b>B</b></button>
            <button class="np-fmt-btn" data-fmt="check" title="Checklist">☑</button>
            <button class="np-fmt-btn" data-fmt="toggle-check" title="Done">✓</button>
            <button class="np-fmt-btn" data-fmt="bullet" title="List">•</button>
            <button class="np-fmt-btn" id="np-template-btn" title="Templates">📑</button>
          </div>

          <div class="fmt-group">
            <button type="button" class="np-mini-btn" id="np-font-dec">A−</button>
            <input id="np-font-size" type="number" min="10" max="72" value="16" aria-label="Notepad font size" class="np-size-input">
            <button type="button" class="np-mini-btn" id="np-font-inc">A+</button>
          </div>

          <div class="fmt-group np-bg-picker" title="Paper Style">
            <button type="button" class="np-bg-btn active" data-np-bg="white" title="White">⬜</button>
            <button type="button" class="np-bg-btn" data-np-bg="cream" title="Cream">🟨</button>
            <button type="button" class="np-bg-btn" data-np-bg="ruled" title="Lines">📓</button>
            <button type="button" class="np-bg-btn" data-np-bg="grid" title="Grid">📐</button>
            <button type="button" class="np-bg-btn" data-np-bg="dark" title="Dark">⬛</button>
          </div>
        </div>

        <div class="np-pen-bar hidden" id="np-pen-bar">
          <button type="button" class="np-pen-color active" data-pen-color="#0f172a" style="background:#0f172a;"></button>
          <button type="button" class="np-pen-color" data-pen-color="#2563eb" style="background:#2563eb;"></button>
          <button type="button" class="np-pen-color" data-pen-color="#dc2626" style="background:#dc2626;"></button>
          <button type="button" class="np-pen-color" data-pen-color="#059669" style="background:#059669;"></button>
          <select id="np-pen-size" class="np-pen-size-sel">
            <option value="2">Thin</option>
            <option value="4" selected>Med</option>
            <option value="8">Thick</option>
          </select>
          <button type="button" class="np-mini-btn" id="np-pen-eraser" title="Eraser">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/></svg>
          </button>
          <button type="button" class="np-mini-btn" id="np-pen-undo" title="Undo">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
          </button>
          <button type="button" class="np-mini-btn" id="np-pen-clear" title="Clear Ink">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          </button>
        </div>

        <div class="notepad-body np-paper-white" id="np-paper-area">
          <textarea id="np-editor" placeholder="Start typing notes here, or tap 'Draw' above to write with your finger or stylus..."></textarea>
          <canvas id="np-ink-canvas"></canvas>
        </div>

        <div class="notepad-footer">
          <span class="np-status" id="np-save-status" style="display:none;">Saved</span>
          <span class="np-word-count" id="np-word-count" style="display:none;">0 words</span>
          <div class="np-footer-share-group">
            <button class="np-share-btn wa-btn" id="np-share-whatsapp">WhatsApp</button>
            <button class="np-share-btn pdf-btn" id="np-export-pdf">PDF</button>
            <button class="np-share-btn share-icon-btn" id="np-share-native">Share</button>
            <button class="np-stamp-btn" id="np-stamp-to-canvas">To Board</button>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Clean Bottom Ad Banner Strip (Free with Ads + 1-Click Remove Ads) -->
  <aside id="app-ad-banner" class="app-ad-strip" aria-label="Sponsor Banner">
    <div class="ad-content-box">
      <span class="ad-badge">AD</span>
      <span class="ad-text">Resuvika Omni Pen · Vikashya Resuvika Private Limited · All Features Free</span>
    </div>
    <button class="ad-remove-btn" id="btn-remove-ads" title="Upgrade to Pro: Remove all ads forever">
      ✨ Remove Ads
    </button>
  </aside>

  <div id="toast" class="toast-box"></div>

  <!-- Scripts (Includes PeerJS for WebRTC Cross-Network Sync) -->
  <aside id="text-controls" class="text-controls" aria-label="Text size controls">
    <label for="text-font-size">Text size</label><button id="text-smaller" aria-label="Smaller text">A−</button>
    <input id="text-font-size" type="number" min="8" max="240" value="32" step="1" aria-label="Text size in pixels"><span>px</span>
    <button id="text-larger" aria-label="Larger text">A+</button><span class="text-help">Tap existing text to edit</span>
  </aside>
  <script src="js/canvas.js"></script>
  <script src="js/notepad.js"></script>
  <script src="js/sync-local.js"></script>
  <script src="js/presentation.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tool-preferences.js"></script>

  <script>
      document.getElementById('ipad-room-display').textContent = 'Local pairing';
      document.getElementById('ipad-fs-btn').addEventListener('click', async () => {
        try { if (document.fullscreenElement) await document.exitFullscreen?.(); else await document.documentElement.requestFullscreen?.(); } catch {}
      });
    </script>
</body>
